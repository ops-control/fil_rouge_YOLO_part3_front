<div #modalEl class="modal fade" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
  
        <div class="modal-header">
          <h5 class="modal-title">{{ titre }}</h5>
          <button type="button" class="btn-close" (click)="close()" aria-label="Close"></button>
        </div>
  
        <div class="modal-body">
          <ng-content></ng-content>
        </div>
  
        <div class="modal-footer">
          <button class="btn btn-secondary" (click)="close()">Fermer</button>
          <button class="btn btn-success" (click)="confirmer()">Confirmer</button>
        </div>
  
      </div>
    </div>
  </div>
