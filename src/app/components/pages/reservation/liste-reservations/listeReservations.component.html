<h3>Réservations du jour :</h3>
<div>
    <p *ngIf="todayReservations.length == 0">Il n'y a aucune reservation pour aujourd'hui.</p>
    <app-item-reservation *ngFor="let resa of todayReservations" [reservation]="resa"></app-item-reservation>
</div>

<h3>Réservations à venir :</h3>
<div>
    <p *ngIf="upcomingReservations.length == 0">Il n'y a aucune reservation à venir.</p>
    <app-item-reservation *ngFor="let resa of upcomingReservations" [reservation]="resa"></app-item-reservation>
</div>
<button type="button" class="btn btn-success" (click)="createReservation()">Ajouter une réservation</button>
