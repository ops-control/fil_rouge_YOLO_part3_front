<button *ngIf="tableOccupee?.idCommande != null" class="btn btn-danger w-100 py-3 mb-4">
    {{tableOccupee?.numeroTable}}

<button *ngIf="tableOccupee?.idCommande == null" [routerLink]="['/carte']" routerLinkActive="active" class="btn btn-success w-100 py-3 mb-4">
    {{tableOccupee?.numeroTable}}
</button>
