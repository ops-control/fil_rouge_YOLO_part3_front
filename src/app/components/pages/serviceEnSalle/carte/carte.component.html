<div class="container px-4">
  <div class="container bg-white rounded-2">
    <div *ngIf="carte" class="pt-3 px-2">
      <div class="row align-items-center">
        <div class="col-10"><h2>Table n° {{table?.numeroTable}}</h2></div>
        <div class="col-2 text-end fs-1 pb-0 text-black">
          <a [routerLink]="['/service']" routerLinkActive="active" class="text-decoration-none text-black">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-x-circle" viewBox="0 0 16 16">
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 0 0 8 0a8 8 0 0 0 0 16"/>
              <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
            </svg>
          </a>
        </div>
        <div class="pb-4 fs-5">Client : {{commande?.nomClient}}</div>
      </div>
        
      <div *ngFor="let cat of categories" class="">
        <div class="row align-items-center mb-2 pe-3 bg-light rounded-5">
          <div class="col-8 pt-1">
            <div><strong>{{ cat.title }}</strong></div>
          </div>
          <div class="col-2 text-center text-black">
            <div>Qté</div>
          </div>
          <div class="col-1 text-start text-black">
            <div></div>
          </div>
          <div class="col-1 text-start text-black">
            <div></div>
          </div>
        </div>
        <div class="pb-3 pe-3">
          <div *ngFor="let plat of getPlatsByCategorie(cat.libelle)">
            <div class="row align-items-center">
              <div class="col-8 pt-2">
                <div>{{ plat.nom }}</div>
              </div>
              <div class="col-2 text-center text-black">
                <div>{{ plat.quantite || 0}}</div>
              </div>
              <div class="col-1 text-end text-black">
                <div (click)="ajouterPlat(plat)" style="cursor: pointer;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="#198754" class="bi bi-plus-square-fill" viewBox="0 0 16 16">
                    <path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm6.5 4.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3a.5.5 0 0 1 1 0"/>
                  </svg>
                </div>
              </div>
              <div class="col-1 text-end text-black">
                <div (click)="retirerPlat(plat)" style="cursor: pointer;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="#777777" class="bi bi-dash-square" viewBox="0 0 16 16">
                    <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                    <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8"/>
                  </svg>
                </div>
              </div>
            </div>

          </div>
          <div *ngIf="getPlatsByCategorie(cat.libelle).length === 0">
            Aucun plat disponible dans cette catégorie.
          </div>
        </div>
      </div>
    </div>
    <div class="container-fluid p-0 pt-3">
      <button class="btn btn-success btn-lg w-100 py-3 mb-3" (click)="passerCommande()">Enregistrer</button>
    </div>
  </div>
</div>
